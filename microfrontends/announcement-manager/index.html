<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>announcement-manager (local)</title>
  </head>
  <body>
    <announcement-manager></announcement-manager>
    <script>
      // Local stand-in for the config attribute that Entando injects at runtime.
      fetch('/mfe-config.json')
        .then((response) => response.json())
        .then((config) => {
          document.querySelector('announcement-manager').setAttribute('config', JSON.stringify(config));
        });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
